[package]
name = "peerrpc-interop-rs"
version = "0.1.0"
edition = "2021"
publish = false

[[bin]]
name = "peerrpc-interop-rs"
path = "src/main.rs"

[dependencies]
peerrpc-protocol = { path = "../../../peerrpc-rs/protocol" }
peerrpc-rpc = { path = "../../../peerrpc-rs/rpc" }
peerrpc-peer = { path = "../../../peerrpc-rs/peer" }
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
tracing-subscriber = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ureq = { version = "2", features = ["json"] }
webrtc = "0.11"
reqwest = { version = "0.12", features = ["json"] }
