# Performance regression gate: run Go benchmarks on every PR against
# main and alert when any benchmark regresses by more than 20%.

name: bench

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: bench-${{ github.ref }}
  cancel-in-progress: true

jobs:
  benchmark:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write

    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: stable
          cache-dependency-path: peerrpc-go/go.sum

      - name: Run benchmarks
        working-directory: peerrpc-go
        run: |
          go test -bench=. -benchmem -count=5 -timeout 600s ./bench/... | tee bench-output.txt

      - name: Store benchmark results
        uses: benchmark-action/github-action-benchmark@v1
        with:
          tool: 'go'
          output-file-path: peerrpc-go/bench-output.txt
          benchmark-data-dir-path: 'benchmarks'
          alert-threshold: '120%'
          comment-on-alert: true
          fail-on-alert: true
          github-token: ${{ secrets.GITHUB_TOKEN }}
          auto-push: ${{ github.event_name == 'push' }}
