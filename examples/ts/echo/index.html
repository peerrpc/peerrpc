<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>PeerRPC Echo Demo</title>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 720px; margin: 40px auto; padding: 0 20px; }
    h1 { margin-bottom: 0.25em; }
    .status { padding: 8px 12px; border-radius: 6px; margin: 12px 0; font-family: monospace; font-size: 14px; }
    .status.idle { background: #f0f0f0; color: #666; }
    .status.connecting { background: #fff3cd; color: #856404; }
    .status.connected { background: #d4edda; color: #155724; }
    .status.error { background: #f8d7da; color: #721c24; }
    button { padding: 8px 16px; margin: 4px 0; font-size: 14px; cursor: pointer; }
    button:disabled { opacity: 0.5; cursor: default; }
    input { padding: 8px; font-size: 14px; width: 300px; margin-right: 8px; }
    pre { background: #f8f9fa; padding: 12px; border-radius: 6px; overflow-x: auto; font-size: 13px; }
    .row { margin: 8px 0; }
  </style>
</head>
<body>
  <h1>PeerRPC Echo Demo</h1>
  <p>TypeScript browser client calling a Go server over WebRTC.</p>

  <div id="status" class="status idle">Disconnected</div>

  <div class="row">
    <label>Signal server URL: <input id="signal-url" value="http://localhost:8080" /></label>
  </div>
  <div class="row">
    <label>Room ID: <input id="room-id" value="demo-room" /></label>
  </div>

  <div class="row">
    <button id="connect-btn">Connect to Peer</button>
  </div>

  <div id="rpc-section" style="display:none">
    <h2>Unary RPC</h2>
    <div class="row">
      <input id="unary-input" value="hello from browser" />
      <button id="unary-btn">Send Unary</button>
    </div>
    <pre id="unary-output">No response yet</pre>

    <h2>Server Streaming RPC</h2>
    <div class="row">
      <input id="stream-input" value="stream-me" />
      <button id="stream-btn">Send Stream</button>
    </div>
    <pre id="stream-output">No chunks yet</pre>
  </div>

  <script type="module" src="./src/main.ts"></script>
</body>
</html>
