[package]
name = "peerrpc-echo-server"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
publish = false
description = "PeerRPC Rust echo server: serves echo.Echo over a ws-only signal-server"

[[bin]]
name = "peerrpc-echo-server"
path = "src/main.rs"

[dependencies]
peerrpc-protocol = { path = "../../peerrpc-rs/protocol" }
peerrpc-rpc = { path = "../../peerrpc-rs/rpc" }
peerrpc-peer = { path = "../../peerrpc-rs/peer" }
peerrpc-signal = { path = "../../peerrpc-rs/signal", features = ["ws"] }
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["fmt"] }
