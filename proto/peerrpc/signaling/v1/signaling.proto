syntax = "proto3";

package peerrpc.signaling.v1;

option go_package = "github.com/peerrpc/go/gen/proto/peerrpc/signaling/v1;signalingpb";

// SignalingService is the rendezvous service used by two PeerRPC nodes
// to exchange WebRTC SDP offers/answers and ICE candidates before a
// DataChannel is established.
//
// The service is implemented with connect-go so a single handler
// transparently serves gRPC, gRPC-Web and Connect clients (PLAN.md §4.3).
service SignalingService {
  // Exchange is a bidirectional stream. A client joins a room and then
  // exchanges offer / answer / candidate messages with peers in the same
  // room until either side closes the stream or the room is destroyed.
  rpc Exchange(stream SignalMessage) returns (stream SignalMessage);
}

// SignalMessage is the single envelope on the Exchange stream. Exactly
// one field of `body` is set per message.
message SignalMessage {
  // room_id is the signaling room identifier. Two peers wishing to
  // establish a DataChannel MUST join the same room_id.
  string room_id = 1;

  oneof body {
    JoinRequest join = 2;
    SdpOffer offer = 3;
    SdpAnswer answer = 4;
    IceCandidate candidate = 5;
    LeaveRequest leave = 6;
    Ping ping = 7;
  }
}

// JoinRequest joins (or creates) a signaling room.
// Auth is enforced server-side via a Connect interceptor that validates
// the Authorization header before the stream is admitted.
message JoinRequest {
  // peer_id is the caller-chosen identifier for itself within the room.
  // The server MAY reject duplicates.
  string peer_id = 1;

  // role disambiguates which peer initiates the WebRTC offer.
  enum Role {
    ROLE_UNSPECIFIED = 0;
    ROLE_OFFERER = 1;
    ROLE_ANSWERER = 2;
  }
  Role role = 2;
}

// SdpOffer carries a WebRTC SessionDescription of type "offer".
message SdpOffer {
  string sdp = 1;
}

// SdpAnswer carries a WebRTC SessionDescription of type "answer".
message SdpAnswer {
  string sdp = 1;
}

// IceCandidate carries a single ICE candidate (serialized per the
// WebRTC RTCIceCandidateInit dictionary).
message IceCandidate {
  // candidate is the raw candidate string.
  string candidate = 1;
  // sdp_mid is the media stream identification tag.
  string sdp_mid = 2;
  // sdp_mline_index is the zero-based index of the m-line.
  uint32 sdp_mline_index = 3;
}

// LeaveRequest signals graceful departure from the room.
message LeaveRequest {
  string reason = 1;
}

// Ping is a liveness probe; the server echoes it back as a Ping with
// the same payload.
message Ping {
  int64 timestamp_ms = 1;
}
